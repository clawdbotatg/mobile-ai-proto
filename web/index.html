<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Browser</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0b0e14; color: #dde3ee; font: 15px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top); }
  #urlbar { display: flex; gap: 6px; padding: 6px 8px; background: #131826; align-items: center; }
  #urlbar button { background: #1e2638; color: #dde3ee; border: 0; border-radius: 8px; padding: 8px 11px; font-size: 15px; }
  #url { flex: 1; background: #0b0e14; color: #9fb0cc; border: 1px solid #232c42; border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 0; }
  #viewwrap { flex: 1; position: relative; background: #000; overflow: hidden; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #status { position: absolute; top: 8px; right: 8px; background: rgba(19,24,38,.85); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #7d8db0; pointer-events: none; }
  #status.working { color: #ffd166; }
  #keyrow { display: flex; gap: 6px; padding: 6px 8px; background: #131826; }
  #pagetext { flex: 1; background: #0b0e14; color: #dde3ee; border: 1px solid #232c42; border-radius: 8px; padding: 8px 10px; font-size: 14px; min-width: 0; }
  #keyrow button { background: #1e2638; color: #dde3ee; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 15px; }
  #chat { background: #0e1220; border-top: 1px solid #1c2438; display: flex; flex-direction: column; height: 34%; padding-bottom: env(safe-area-inset-bottom); }
  #chat.collapsed { height: auto; }
  #chat.collapsed #msgs { display: none; }
  #chathead { display: flex; align-items: center; padding: 6px 12px; font-size: 12px; color: #7d8db0; letter-spacing: .06em; }
  #chathead span { flex: 1; }
  #msgs { flex: 1; overflow-y: auto; padding: 4px 10px; }
  .m { max-width: 88%; margin: 5px 0; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .me { background: #2a4a8a; margin-left: auto; }
  .ai { background: #1a2135; }
  .sys { color: #66738f; font-size: 12px; text-align: center; background: none; margin: 4px auto; }
  #chatrow { display: flex; gap: 6px; padding: 6px 8px; }
  #chatmsg { flex: 1; background: #131826; color: #dde3ee; border: 1px solid #232c42; border-radius: 10px; padding: 9px 11px; font-size: 15px; min-width: 0; }
  #send { background: #2a4a8a; color: #fff; border: 0; border-radius: 10px; padding: 9px 16px; font-size: 15px; }
  #send:disabled { opacity: .4; }
</style>
</head>
<body>
<div id="app">
  <div id="urlbar">
    <button id="back">‹</button>
    <input id="url" placeholder="url or search" autocapitalize="off" autocomplete="off">
    <button id="go">Go</button>
  </div>
  <div id="viewwrap">
    <img id="view" alt="">
    <div id="status">connecting…</div>
  </div>
  <div id="keyrow">
    <input id="pagetext" placeholder="type into the page…" autocapitalize="off" autocomplete="off">
    <button id="pgenter">⏎</button>
    <button id="pgbs">⌫</button>
  </div>
  <div id="chat" class="collapsed">
    <div id="chathead"><span>AI AGENT</span><b id="toggle">▲</b></div>
    <div id="msgs"></div>
    <div id="chatrow">
      <input id="chatmsg" placeholder="ask the agent…">
      <button id="send">Send</button>
    </div>
  </div>
</div>
<script>
const T = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const view = $("view"), status = $("status"), urlEl = $("url"), msgs = $("msgs"), chat = $("chat");
let ws, agentWorking = false;

function setStatus() {
  status.textContent = agentWorking ? "🤖 agent working…" : (ws && ws.readyState === 1 ? "live" : "reconnecting…");
  status.classList.toggle("working", agentWorking);
}
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?t=" + T);
  ws.onopen = setStatus;
  ws.onclose = () => { setStatus(); setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "frame") view.src = "data:image/jpeg;base64," + m.data;
    else if (m.type === "url") { if (document.activeElement !== urlEl) urlEl.value = m.url; }
    else if (m.type === "agent") { agentWorking = m.state === "working"; setStatus(); }
  };
}
connect();
const wsend = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

// --- touch/mouse on the browser view: tap + drag-to-scroll ---
const wrap = $("viewwrap");
function frameRect() {
  // img uses object-fit:contain — compute the drawn frame box inside the wrap
  const r = wrap.getBoundingClientRect();
  const iw = view.naturalWidth || 412, ih = view.naturalHeight || 840;
  const s = Math.min(r.width / iw, r.height / ih);
  const w = iw * s, h = ih * s;
  return { x: r.left + (r.width - w) / 2, y: r.top + (r.height - h) / 2, w, h };
}
let tStart = null, moved = false, lastY = 0;
function norm(cx, cy) {
  const f = frameRect();
  return { x: Math.min(1, Math.max(0, (cx - f.x) / f.w)), y: Math.min(1, Math.max(0, (cy - f.y) / f.h)) };
}
function down(cx, cy) { tStart = { cx, cy }; moved = false; lastY = cy; }
function move(cx, cy) {
  if (!tStart) return;
  if (Math.abs(cx - tStart.cx) + Math.abs(cy - tStart.cy) > 12) moved = true;
  if (moved) {
    const dy = lastY - cy;
    if (Math.abs(dy) > 4) { const n = norm(tStart.cx, tStart.cy); wsend({ type: "scroll", x: n.x, y: n.y, dy: Math.round(dy * 2) }); lastY = cy; }
  }
}
function up(cx, cy) {
  if (tStart && !moved) { const n = norm(cx, cy); wsend({ type: "tap", x: n.x, y: n.y }); }
  tStart = null;
}
wrap.addEventListener("touchstart", (e) => { e.preventDefault(); const t = e.touches[0]; down(t.clientX, t.clientY); }, { passive: false });
wrap.addEventListener("touchmove", (e) => { e.preventDefault(); const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: false });
wrap.addEventListener("touchend", (e) => { e.preventDefault(); const t = e.changedTouches[0]; up(t.clientX, t.clientY); }, { passive: false });
wrap.addEventListener("mousedown", (e) => down(e.clientX, e.clientY));
wrap.addEventListener("mousemove", (e) => { if (e.buttons) move(e.clientX, e.clientY); });
wrap.addEventListener("mouseup", (e) => up(e.clientX, e.clientY));
wrap.addEventListener("wheel", (e) => { e.preventDefault(); const n = norm(e.clientX, e.clientY); wsend({ type: "scroll", x: n.x, y: n.y, dy: Math.round(e.deltaY) }); }, { passive: false });

// --- url bar / keys ---
$("go").onclick = () => { wsend({ type: "nav", url: urlEl.value }); urlEl.blur(); };
urlEl.addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").onclick(); });
$("back").onclick = () => wsend({ type: "back" });
const pt = $("pagetext");
function sendPageText(withEnter) {
  if (pt.value) wsend({ type: "text", text: pt.value });
  if (withEnter) wsend({ type: "key", key: "Enter" });
  pt.value = "";
}
pt.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendPageText(true); } });
$("pgenter").onclick = () => sendPageText(true);
$("pgbs").onclick = () => wsend({ type: "key", key: "Backspace" });

// --- chat ---
function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = "m " + cls;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}
$("toggle").onclick = $("chathead").onclick = () => { chat.classList.toggle("collapsed"); $("toggle").textContent = chat.classList.contains("collapsed") ? "▲" : "▼"; };
const chatmsg = $("chatmsg"), sendBtn = $("send");
async function sendChat() {
  const msg = chatmsg.value.trim();
  if (!msg || agentWorking) return;
  chat.classList.remove("collapsed"); $("toggle").textContent = "▼";
  addMsg("me", msg);
  chatmsg.value = "";
  sendBtn.disabled = true; agentWorking = true; setStatus();
  addMsg("sys", "agent is working — watch the browser…");
  try {
    const r = await fetch("/chat?t=" + T, { method: "POST", body: JSON.stringify({ msg }) });
    const j = await r.json();
    addMsg("ai", j.reply);
  } catch (e) { addMsg("sys", "error: " + e.message); }
  sendBtn.disabled = false; agentWorking = false; setStatus();
}
sendBtn.onclick = sendChat;
chatmsg.addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });
setStatus();
</script>
</body>
</html>
